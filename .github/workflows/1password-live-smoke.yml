name: 1Password live smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/1password-live-smoke.yml"
      - "packages/secret-vault/**"
      - "packages/secret-vault-1password/**"
  workflow_dispatch:

concurrency:
  group: 1password-live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Disposable vault round trip
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      WYSTACK_1PASSWORD_LIVE_TEST: "1"
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.WYSTACK_1PASSWORD_SMOKE_TOKEN }}
      OP_VAULT_ID: ${{ vars.WYSTACK_1PASSWORD_SMOKE_VAULT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run smoke:1password
